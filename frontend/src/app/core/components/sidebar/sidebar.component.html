<aside class="sidebar">

    <div class="logo-section">
        <h2>Gestor de Stock</h2>
        <span>y Comprobantes</span>
    </div>

    <nav class="menu">
        @for (item of items(); track item.ruta) {
            <a [routerLink]="item.ruta" routerLinkActive="active-link">
                <i [class]="'pi ' + item.icono"></i>
                {{ item.etiqueta }}
            </a>
        }
    </nav>

    <div class="user-panel">

        <div class="user-info">
            <strong>{{ authService.usuarioActual()?.username }}</strong>
            <small>{{ authService.rol() }}</small>
        </div>

        <button
            pButton
            label="Cerrar sesión"
            icon="pi pi-sign-out"
            severity="danger"
            (click)="authService.logout()">
        </button>

    </div>

</aside>
